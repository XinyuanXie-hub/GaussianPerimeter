# Fill in the placeholders after Comparator passes.
project:
  name: "Improved lower bound for the maximal Gaussian perimeter of convex sets"
  description: "Verification that the limit inferior of the maximal Gaussian perimeter of convex sets in dimension n, divided by n^(1/4), is at least 0.31258, as shown in the source."
  authors:
    - "Xinyuan Xie"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xinyuan Xie"

classification:
  arxiv: ["math.PR"]

sources:
  - title: "Grokability in five inequalities"
    authors: ["Paata Ivanisvili", "Xinyuan Xie"]
    id: "arXiv:2605.05193"
    relationship: "formalizes"

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI agents drafted and revised the Lean statement, implemented
        the proof, and ran verification under human direction.

review:
  status: "self-assessed"
  notes: >-
    The project owner reviewed and approved the statement and definitions
    before proof development. The solution passed Comparator with Lean,
    NanoDa, and con-ron.
